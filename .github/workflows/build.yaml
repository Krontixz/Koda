name: Build Koda Installers
on: [push]

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: .dmg
          - os: ubuntu-latest
            target: aarch64-linux-android
            suffix: .apk

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        run: rustup target add ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      # Windows: Create a simple Zip for now (or use NSIS)
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          compress-archive -Path target/${{ matrix.target }}/release/koda.exe -DestinationPath koda_win.zip

      # MacOS: Create a DMG
      - name: Package MacOS
        if: matrix.os == 'macos-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/koda dist/
          hdiutil create -volname "Koda Installer" -srcfolder dist -ov -format UDZO koda_mac.dmg

      # Upload the finished files
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: koda-${{ matrix.os }}
          path: |
            *.zip
            *.dmg
            *.apk
